[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-amc_allocator_env"
version = "0.1.0"
description = "AMC allocator environment for OpenEnv"
requires-python = ">=3.11"
dependencies = [
    "openenv-core[core]>=0.2.2",
    "openai>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
server = "amc_allocator_env.server.app:main"

[tool.setuptools]
include-package-data = true
packages = [
    "amc_allocator_env",
    "amc_allocator_env.data",
    "amc_allocator_env.server",
]

[tool.setuptools.package-dir]
amc_allocator_env = "."
"amc_allocator_env.data" = "data"
"amc_allocator_env.server" = "server"
